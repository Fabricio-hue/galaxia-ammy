<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feliz cumpleaños Ammy</title>
<style>
:root{--bg:#05000a;--rosa:#ff4fa3;--claro:#ffe3f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:Georgia,"Times New Roman",serif;color:var(--claro);touch-action:none}
canvas{display:block}
h1{position:absolute;top:5%;left:0;right:0;margin:0;text-align:center;font-style:italic;font-size:clamp(26px,7vw,52px);color:var(--rosa);text-shadow:0 0 18px #ff2d8a,0 0 40px #b0125f;pointer-events:none}
#hint{position:absolute;top:calc(5% + 62px);left:0;right:0;text-align:center;font-size:13px;opacity:.7;pointer-events:none}
#bar{position:absolute;bottom:18px;left:0;right:0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 12px}
button,label.b{font:inherit;font-size:15px;color:var(--claro);background:rgba(255,79,163,.18);border:1px solid var(--rosa);border-radius:999px;padding:10px 18px;cursor:pointer;backdrop-filter:blur(6px)}
button:focus-visible,label.b:focus-visible{outline:2px solid #fff;outline-offset:2px}
#lb,#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,0,10,.88);flex-direction:column;text-align:center;padding:24px}
#lb img{max-width:92vw;max-height:80vh;border-radius:18px;border:3px solid var(--rosa);box-shadow:0 0 40px #ff2d8a}
#msg p{font-size:clamp(15px,4vw,22px);max-width:560px;max-height:70vh;overflow-y:auto;white-space:pre-line;line-height:1.5;text-shadow:0 0 16px #ff2d8a}
.h{position:absolute;bottom:-30px;font-size:24px;animation:up 4s linear forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-110vh)}}
@media (prefers-reduced-motion:reduce){.h{animation-duration:8s}}
